<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEE801" />
    <title>פסטיבל מְדּוֹרוֹת 2027 · אמנות יהודית מציתה מחשבה</title>
    <meta name="description" content="מְדּוֹרוֹת 2027 – פסטיבל לאמנות עכשווית בירושלים. קוֹל קוֹרֵא: פַּנּוּ דֶּרֶךְ... להגשת הצעות לאמנים.ות, יוצרים.ות וקולקטיבים." />
    <meta property="og:title" content="פסטיבל מְדּוֹרוֹת 2027" />
    <meta property="og:description" content="אמנות יהודית מציתה מחשבה · קוֹל קוֹרֵא: פַּנּוּ דֶּרֶךְ..." />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:type" content="website" />
    <!-- absolute: link previews (WhatsApp, Facebook) ignore relative image URLs. Update with the final domain. -->
    <meta property="og:url" content="https://medorot-2027.vercel.app/" />
    <meta property="og:image" content="https://medorot-2027.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="פסטיבל מדורות: הלוגו ויצור פסל מחלקי פסלים, על רקע צהוב" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Interim: Frank Ruhl Libre (variable) from Google Fonts. Production loads Frank Ruhl Libre Variable from the
         festival's Adobe Fonts web project once its embed ID is supplied. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&display=swap" rel="stylesheet" />
    <!-- Site language before the first paint (Hebrew unless ?lang=en or an earlier choice in this browser), so an
         English page never flashes right-to-left. The same rules live in src/i18n/lang.tsx. -->
    <script>
      try {
        var q = new URLSearchParams(location.search).get('lang'), s = null
        try { s = localStorage.getItem('medorot-lang') } catch (e) {}
        var l = q === 'en' || q === 'he' ? q : s
        if (l === 'en' && !/^\/(concepts|c)(\/|$)/.test(location.pathname)) {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
